[tools]
bun = "latest"
node = "latest"
rclone = "latest"
github-cli = "latest"
ripgrep = "latest"
direnv = "latest"
lazygit = "latest"
zellij = "latest"
fd = "latest"
zoxide = "latest"
fzf = "latest"
yazi = "latest"
uv = "latest"
amp = { version = "latest", npm_args = "--ignore-scripts=false" }
"npm:droid" = { version = "latest", npm_args = "--ignore-scripts=false" }
rust = "latest"
ast-grep = "latest"
bat = "latest"
delta = "latest"
"aqua:neovim/neovim" = "latest"
opentofu = "latest"
jless = "latest"
oh-my-posh = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
codex = "latest"
python = "3.12"
"npm:hunkdiff" = "latest"
claude = "latest"
"npm:pnpm" = "latest"
infisical = { version = "latest", asset_pattern = "cli_{{ version }}_{{ os(macos='darwin') }}_{{ arch(x64='amd64') }}.tar.gz" }
"npm:node-gyp" = "latest"
"asdf:icholy/asdf-cursor-agent" = "latest"
"npm:calldiff" = "latest"
grok = { version = "latest", bin = "grok", platforms = { windows-arm64 = { bin = "grok.exe", url = "https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-windows-aarch64.exe" }, windows-x64 = { bin = "grok.exe", url = "https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-windows-x86_64.exe" } }, url = 'https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-{{ os() }}-{{ arch(x64="x86_64", arm64="aarch64") }}', version_list_url = "https://x.ai/cli/stable" }
btop = "latest"
"npm:t3" = "nightly"

[tools."http:devin"]
version = "latest"
bin_path = "bin"
version_list_url = "https://static.devin.ai/cli/current/manifest.json"
version_expr = "[fromJSON(body).version]"
checksum_url = "https://static.devin.ai/cli/{{version}}/manifest.json"
checksum_expr = '"sha256:" + filter(values(fromJSON(body).platforms), { #.url == url })[0].sha256'

[tools."http:devin".platforms]
linux-arm64 = { url = "https://static.devin.ai/cli/{{version}}/devin-{{version}}-aarch64-unknown-linux.tar.gz" }
linux-x64 = { url = "https://static.devin.ai/cli/{{version}}/devin-{{version}}-x86_64-unknown-linux.tar.gz" }
macos-arm64 = { url = "https://static.devin.ai/cli/{{version}}/devin-{{version}}-aarch64-apple-darwin.tar.gz" }
macos-x64 = { url = "https://static.devin.ai/cli/{{version}}/devin-{{version}}-x86_64-apple-darwin.tar.gz" }

[settings]
minimum_release_age_excludes = ["amp", "npm:droid", "codex", "npm:@earendil-works/pi-coding-agent", "claude", "npm:t3"]
