[ui]
max_thoughts_width = 120
theme = "grokday"
fork_secondary_model = "grok-4.7"
yolo = true
compact_mode = false
permission_mode = "always-approve"
remember_tool_approvals = true

[subagents]
enabled = true

[subagents.toggle]
explore = true
plan = true

[models]
default = "grok-4.7-build-fast"
default_reasoning_effort = "xhigh"

[marketplace]
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[cli]
auto_update = true
installer = "npm"
